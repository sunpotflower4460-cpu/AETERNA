name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: lint, typecheck, release checks, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Release checks (forbidden claims, required docs, config defaults)
        run: npm run check:release

      - name: Run tests
        run: npm run test:run
